submission:
  title: "ChainSentinel — Supply Chain Disruption Assistant & Fleet Utilisation Optimizer"
  problem_statement: >
    Mid-size freight operators lose visibility during supply-chain disruptions because disruption
    impact, fleet idle capacity, and cold-chain sensor integrity are managed in separate tools.
    Identifying affected shipments, redeployable fleet, and cold-chain excursions requires manual
    cross-referencing that does not scale — and temperature breaches are often discovered only at
    delivery, after the cargo is already a write-off.
  solution_summary: >
    ChainSentinel is a Bob-powered logistics control tower that unifies disruption response, fleet
    redeployment, and cold-chain monitoring into a single ranked, explainable, human-approved
    action plan. A combined disruption + cold-chain priority score identifies the highest-risk
    shipments; 11 read-only MCP tools ground Bob's answers in backend data with visible evidence;
    no recommendation is auto-executed without operator approval and an audit trail entry.
  key_features:
    - "Disruption management with real-time affected-shipment detection, match reasons and impact scores"
    - "Ranked route and carrier alternatives with transparent scoring and rejected-option explanations"
    - "Fleet idle detection and compatibility-aware redeployment candidate ranking"
    - "Cold-chain sensor monitoring — ingestion, data-quality flags, per-shipment sensor health"
    - "Temperature excursion detection and configurable severity classification (Warning/Major/Critical/Unknown-Review)"
    - "Combined disruption + cold-chain priority score for cross-domain risk ranking"
    - "Human-approval recommendation lifecycle with append-only audit trail"
    - "Grounded IBM Bob assistant (11 MCP tools) with raw evidence alongside every answer"
  repository: "https://github.com/Ronit069/bob-ai-hackathon-team-rangersand"
